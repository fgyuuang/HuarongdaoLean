name = "Huarongdao"
version = "0.1.0"
defaultTargets = ["huarongdao", "export-graph", "solve-puzzle"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[lean_lib]]
name = "Huarongdao"

[[lean_exe]]
name = "huarongdao"
root = "Main"

[[lean_exe]]
name = "export-graph"
root = "ExportMain"

[[lean_exe]]
name = "check-certificate"
root = "CertMain"

[[lean_exe]]
name = "solve-puzzle"
root = "GenericMain"
